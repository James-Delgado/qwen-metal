# Living task backlog. The next action = lowest-`rank` task with `status: ready`.
# Selection is by RANK among ready tasks; `depends_on` is the hard ordering
# constraint, `rank` is the tiebreak. Keep file order roughly rank-sorted for humans.
#
# Seeded 2026-08-20 from the reviewed plan. Phase 0 + Phase 1 tasks are concrete
# (their specs exist: docs/PRD-phase-0.md, docs/phases/phase-0-1.md). Phases 2-6
# get only a SPEC task + an EXEC milestone: per PLAN.md's just-in-time rule, a
# phase's build tasks are seeded by its SPEC task, never invented earlier.
# Context sources for SPEC tasks: docs/reviews/2026-08-20-eng-review.md Part 4.
#
# Full-project DAG (∥ = parallelizable):
#
#   PIN-1 (james) ──────────────┬──────────────► P0A-1 (james)
#                               │                   ▲
#   SETUP-1 ──► P0B-1 ──┬► P0B-2│                   │
#            ∥          ├► P0B-3│                   │
#            ∥          └► P0B-4├───────────────────┘
#            ∥                  │
#            └► P1-2 ∥ P1-3     │   PIN-1 ──► P1-1
#                    │          │              │
#                    └────┬─────┴──────────────┘
#                         ▼
#                       P1-4 ──► P1-5 ──┬─► AUDIT-1
#                                       │
#            P0A-1 ─────────────────────┤
#                                       ▼
#                                    SPEC-P2 ──► P2-EXEC ──► SPEC-P3 ──► P3-EXEC
#                                                                          │
#            P6-EXEC ◄── SPEC-P6 ◄── P5-EXEC ◄── SPEC-P5 ◄── P4-EXEC ◄── SPEC-P4
#
