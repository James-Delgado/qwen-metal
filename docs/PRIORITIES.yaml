      2026-09-13 (seeded from the P4-8 session — two survey axes for
      the charter brief). (1) SAMPLING ARCHITECTURE: llama.cpp samples
      CPU-side BECAUSE its rich sampler chain (grammars, penalties,
      top-k/p) is CPU code — it pays the per-token logits readback P4-8
      removed; MLX gets GPU sampling free from lazy device-side
      composition over a device-resident logits handle (its async_eval
      also pipelines step N+1's encode — bears on the P4-9 fixed-
      overhead question). If samplers re-enter scope (non-goal today),
      the device-vs-CPU fork and its interaction with the P4-8
      exact-equality contract is a charter decision. (2) KV ALLOCATION
      POLICY: MLX grows its cache in 256-token steps (footprint scales
      with use); we and llama.cpp preallocate the full window (our
      448 MiB dominates the 536 MB device footprint). Growth policy is
      a memory-axis lever alongside KV-quantization re-entry; candidate
      middle grounds: size-to-request-bound at decode start (no
      mid-decode growth), or measure whether dirty-page accounting
      already makes untouched cache pages free. Touching this touches
      hard rule 4 — James-owned.
      2026-09-14 (seeded by James, RoPE walkthrough session — accuracy
      axis). (3) EQUIVALENCE-PRESERVED FP16 ROUNDING BOUNDARIES: the
      fused kernel path deliberately re-inserts every fp16 round the
      unfused chain's DRAM boundaries imposed (spec D3), so values that
      now live in registers still round to fp16 mid-kernel purely to
      keep fused-vs-unfused bit-comparability and gate carry-over.
      Known sites (FoldedKernels.swift header + kernels): norm output
      rounds to fp16 before RoPE reads it (qknorm_rope_append_f16);
      matvec accumulators round to fp16 exactly where the naive kernels
      stored (matvec3_q4_f16, gateup_swiglu_q4_f16 — both row dots
      round before SwiGLU — matvec_res_q4_f16 before the residual add);
      norm-fold outputs round where rmsnorm_f16 stored
      (norm_matvec3_q4_f16, norm_gateup_swiglu_q4_f16); FusedSDPAKernel
      keeps the naive fp16-in/fp32-accumulate/fp16-out boundary. James
      wants these addressed in the campaign: once the campaign
      re-derives its own pre-committed gates, keep fp32 in registers
      across fold boundaries and drop the artificial rounds. Costs
      bit-equality with the unfused reference, so it REQUIRES new
      pre-committed tolerances first (hard rule 6) — quality gain is
      real but small (one ~2^-11 round per boundary); sweep ALL such
      sites in one pass, not piecemeal.
      2026-09-14 (seeded by James, same session — context-axis survey,
      requested appended in full). (4) TOKEN RE-INDEXING / CONTEXT
      SCHEMES: split by whether a cached token's logical position
      changes after its key is roped into the cache (we store keys
      post-RoPE, so re-indexing needs a delta-rotation kernel).
      RE-INDEXING: (a) context shift (llama.cpp --ctx-shift): on
      window-full, drop oldest N and shift survivors' positions by -N
      via a K-shift delta-rotation kernel (rotations compose — exact,
      no pre-RoPE value needed); value = unbounded generation at fixed
      memory WITHOUT re-prefill — the clearest chat-product payoff.
      (b) StreamingLLM / attention sinks: pin first ~4 tokens + recent
      window, dense in-cache positions; value = stable perplexity on
      infinite streams with a small fixed cache; caveat = fluency
      preservation, not recall of the evicted middle. (c) Self-Extend
      grouped-position remapping: floor-divide far positions into the
      trained range, exact positions for the recent neighborhood;
      value = context extension without fine-tuning. (d) ADJACENT, not
      re-indexing: PI/NTK/YaRN rescale the position→angle map (touches
      RoPE.init + tables, not the cache); Qwen3 ships YaRN configs —
      the vendor-blessed, lowest-risk extension route. CONTRAST GROUP
      — eviction WITHOUT re-indexing (H2O, SnapKV, TOVA): drop
      low-attention tokens, keep survivors' absolute positions (RoPE
      tolerates position gaps); composes with the rope-into-cache fold
      with ZERO re-rotation machinery — cheapest to implement, but
      quality-vs-memory is a research bet. Axis mapping: memory
      (bounded window caps the 448 MiB cache), sustained speed
      (decode attention is linear in cached length), capability
      (context extension for the §12 A20 ambitions). Session ranking
      (agent assessment, for the charter): context shift + K-shift is
      the chat-product workhorse and exactly verifiable under existing
      methodology (rotation composition diffs bit-for-bit vs CPU
      reference); YaRN is lowest-risk for longer context. INTERACTION
      FLAG: a quantized key cannot be cheaply delta-rotated
      (dequant→rotate→requant, or cache pre-RoPE keys instead) — any
      KV-quantization re-entry and any re-indexing scheme must be
      chartered TOGETHER, not sequentially. All of these touch hard
      rule 4 (preallocation) and the non-goals list — James-owned.
      Product-side counterpart: ideation doc §16 (2026-09-14).

