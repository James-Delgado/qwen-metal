schema:
  task_status: [ready, blocked, in_progress, done, skipped]
  complexity: [small, medium, large]

execution_model:
  concurrency: single-threaded
  pick_procedure: |
    1. Read this file. 2. Find lowest-rank `ready` task. 3. Mark in_progress,
    commit alone. 4. Do the work + tests. 5. Post-task review. 6. Mark done,
    flip unblocked dependents to ready. 7. Commit deliverable + this file.
  # Drift test (tests/test_priorities.py) enforces: status in enum;
  # depends_on/blocks resolve to real ids; <=1 in_progress; done has completed_at.
  # Tasks with `owner: james` are never executed by agents (see AGENT_OPERATION.md).

