  - id: CFG-1
    rank: 13.1
    title: "Harden ModelConfig numeric validation (positiveInt 2^63 boundary, intList bound, double() finiteness)"
    status: done
    started_at: 2026-08-23T21:05:00Z
    completed_at: 2026-08-23T21:20:00Z
    depends_on: []
    blocks: []
    deliverable:
      file: "engine package (io module)"
      tests: "ModelConfigTests bounds/overflow/finiteness edge cases (2^63, 1e20, negative eps/theta)"
    est_complexity: small
    notes: |
      docs/AUDIT.md F1 (HIGH, upheld 3-0) + F3 + F4 (MEDIUM, upheld 1-0) —
      one coherent diff in the same validation layer. F1: `asDouble <=
      Double(Int.max)` admits 2^63 (Double(Int.max) rounds UP to 2^63);
      NSNumber.intValue wraps to Int.min; reproduced traps at QwenModel.swift:53
      (0..<Int.min range) and :60 (numHeads*headDim overflow) from a doctored
      config.json — crash instead of ModelConfigError. F3: double() lacks
      >0 && isFinite for rms_norm_eps/rope_theta -> silent NaN logits
      (RMSNorm.swift:30, RoPE.swift:29). F4: intList (eos_token_id) lacks the
      upper-bound check positiveInt has ("1e20" -> garbage id, no throw).
      Surfaced by AUDIT-1 workflow (swift + silent-failure reviewers).
      RANK BUMPED 26 -> 13.1 on 2026-08-23 (decided by James): all three
      audit tasks land before any Phase 2 decode work; fractional ranks slot
      them after AUDIT-1 (13) without renumbering the chain (IO-1 precedent).
      2026-08-23 (done): landed as one validation-layer diff — integer
      fields via Int(exactly:) (rejects 2^63/out-of-range, still accepts
      Int.max), rms_norm_eps/rope_theta via positiveFiniteDouble
      (isFinite && > 0), intList same Int(exactly:) bound. 6 new
      ModelConfigTests (red-first: 9 failures reproduced the audit claims).
      Suite minus logit gate: 119 tests, 0 failures. See DECISIONS.md
      2026-08-23 CFG-1 entry.

